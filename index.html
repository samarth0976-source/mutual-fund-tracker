<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- App Meta Tags -->
  <title>FundX - Mutual Fund & ETF Tracker</title>
  <meta name="description"
    content="Track mutual funds, ETFs, and IPOs with AI-powered insights. Get live market data, portfolio tracking, and smart investment recommendations." />
  <meta name="keywords" content="mutual funds, ETF, IPO, investment, finance, stock market, portfolio tracker, India" />
  <meta name="author" content="FundX" />

  <!-- Theme Colors -->
  <meta name="theme-color" content="#00e676" />
  <meta name="msapplication-navbutton-color" content="#00e676" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="FundX" />
  <meta name="application-name" content="FundX" />

  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Favicon & Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/logo.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/logo.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192.png" />
  <link rel="mask-icon" href="/logo.png" color="#00e676" />

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="FundX - Mutual Fund & ETF Tracker" />
  <meta property="og:description" content="Track mutual funds, ETFs, and IPOs with AI-powered insights." />
  <meta property="og:image" content="/icons/icon-512.png" />
  <meta property="og:url" content="https://fundx.vercel.app" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="FundX - Mutual Fund & ETF Tracker" />
  <meta name="twitter:description" content="Track mutual funds, ETFs, and IPOs with AI-powered insights." />
  <meta name="twitter:image" content="/icons/icon-512.png" />

  <!-- Cashfree SDK -->
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>

  <!-- Register Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('FundX SW registered:', registration.scope);
          })
          .catch((error) => {
            console.log('FundX SW registration failed:', error);
          });
      });
    }
  </script>
</head>

<body>
  <noscript>
    <div style="padding: 20px; text-align: center; background: #0a0a0a; color: white; min-height: 100vh;">
      <h1>FundX</h1>
      <p>Please enable JavaScript to use FundX.</p>
    </div>
  </noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
